name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    name: Build & self-tests
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: swift --version
      - name: Build
        run: swift build
      - name: Self-tests
        run: swift run SuperScreenshotSelfTest
      - name: Extensions
        run: ./scripts/build-extensions.sh
      - name: App Store edition (sandboxed, -DAPP_STORE) build & self-tests
        run: |
          swift build --scratch-path .build-appstore -Xswiftc -DAPP_STORE
          .build-appstore/debug/SuperScreenshotSelfTest
          DISTRIBUTION=appstore ./scripts/build-app.sh --debug
